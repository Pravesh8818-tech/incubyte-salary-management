# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:${user.home}/salary-management.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQLite Dialect (if not using a library that provides one, we may need to specify)
# Note: Hibernate does not have built-in SQLite dialect; we may need to use a third-party dialect.
# For simplicity, we can rely on the driver and let Hibernate use the default dialect, but better to specify.
# We'll use the dialect from org.hibernate.dialect.SQLiteDialect if available in our dependencies.
# Alternatively, we can set it to org.hibernate.dialect.DerbyTenSevenDialect as a placeholder? Not ideal.
# We'll leave it as is and rely on the fact that we will add a dependency that provides a dialect or we can use a custom one.
# For now, we'll comment out the dialect and let the driver handle it, but we need to specify something.
# Actually, we can use the dialect class from the SQLite JDBC driver? Not sure.
# Let's search for a known Hibernate dialect for SQLite. There is one: org.hibernate.dialect.SQLiteDialect
# but it may not be in the core Hibernate. We'll assume we will add a dependency that provides it.
# For now, we'll set it and hope the dependency provides it.
# If not, we can adjust later.
spring.jpa.database=POSTGRESQL  # This is just a placeholder to avoid errors; we will override with platform
# Better to not set database and just set platform.
spring.jpa.database=